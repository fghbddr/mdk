 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub — Генератор игровых идей</title>
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a1a;
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Шапка сайта */
        header {
            background-color: #050505;
            border-bottom: 2px solid var(--gold);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--gold);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .logo:hover {
            color: var(--gold-hover);
            text-shadow: 0 0 10px var(--gold);
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        /* Контейнер */
        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .page-title h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .page-title h1 span {
            color: var(--gold);
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 18px;
            margin-bottom: 40px;
        }

        /* Доска генератора */
        .generator-board {
            background-color: var(--bg-card);
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }

        .slots-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .slot {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            transition: 0.3s;
        }

        .slot-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--gold);
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .slot-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-light);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Кнопка генерации */
        .btn-generate {
            display: inline-block;
            background-color: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 15px 35px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-generate:hover {
            background-color: var(--gold);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: scale(1.02);
        }
footer {
            text-align: center;
            padding: 30px;
            background-color: #050505;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid #2a2a2a;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <header>
        <a href="index.html" class="logo">GameHub</a>
        <nav class="nav-links">
            <a href="index.html#engines">Движки</a>
            <a href="quiz.html">Пройти Тест</a>
            <a href="assets.html">Бесплатные Ассеты</a>
        </nav>
    </header>

    <div class="container">
        
        <div class="page-title">
            <h1>Генератор <span>Идей</span> для Игр</h1>
            <p>В творческом кризисе или ищешь безумную тему для Game Jam? Нажми на кнопку и брось вызов своей фантазии!</p>
        </div>

        <!-- Игровой автомат с идеями -->
        <div class="generator-board">
            <div class="slots-container">
                
                <!-- Слоты -->
                <div class="slot" id="slot-genre">
                    <div class="slot-title">Жанр игры</div>
                    <div class="slot-value" id="val-genre">???</div>
                </div>

                <div class="slot" id="slot-theme">
                    <div class="slot-title">Случайная тема</div>
                    <div class="slot-value" id="val-theme">???</div>
                </div>

                <div class="slot" id="slot-modifier">
                    <div class="slot-title">Ограничение</div>
                    <div class="slot-value" id="val-modifier">???</div>
                </div>

            </div>

            <!-- Главная кнопка -->
            <button class="btn-generate" onclick="generateIdea()">Сгенерировать идею</button>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 GameHub. Проект начинающих разработчиков.</p>
    </footer>

    <!-- Скрипт генератора -->
    <script>
        // База данных для случайной генерации
        const genres = [
            "2D Платформер", "Пошаговая стратегия", "Шутер от первого лица", 
            "Текстовый квест", "Симулятор выживания", "Головоломка", 
            "Рогалик (Rogue-like)", "Кинематографичный экшен", "Ретро-RPG"
        ];

        const themes = [
            "Подземелье спящего гиганта", "Один в открытом космосе", "Мир, где время идет вспять", 
            "Жизнь внутри компьютерной сети", "Последний работающий робот", "Управление поездом-призраком", 
            "Секретная лаборатория алхимика", "Мир, состоящий из бумаги", "Подводный мегаполис"
        ];

        const modifiers = [
            "У тебя есть всего 60 секунд", "Нельзя использовать прыжки", "Свет включается только при движении", 
            "Главный герой — это предмет обстановки", "Экран постоянно вращается", "Оружие стреляет случайными вещами", 
            "Вся графика состоит из геометрических фигур", "Звук — твое единственное оружие", "Один уровень меняется каждую минуту"
        ];

        function generateIdea() {
            // Берем случайные элементы из массивов
            const randomGenre = genres[Math.floor(Math.random() * genres.length)];
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            const randomModifier = modifiers[Math.floor(Math.random() * modifiers.length)];

            // Подсвечиваем слоты золотом при клике
            const slots = document.querySelectorAll('.slot');
            slots.forEach(slot => {
                slot.style.borderColor = '#d4af37';
                slot.style.boxShadow = '0 0 10px rgba(212, 175, 55, 0.2)';
            });

            // Выводим текст на экран
            document.getElementById("val-genre").innerText = randomGenre;
            document.getElementById("val-theme").innerText = randomTheme;
            document.getElementById("val-modifier").innerText = randomModifier;
        }
    </script>

</body>
</html>
